name: CI

on:
  pull_request:
  push:
    branches: [main]

# Một PR đẩy nhiều commit liên tiếp: chỉ chạy lần cuối.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # content:verify chạy lời giải mẫu bằng CPython thật (xem docs/testing.md).
      # Cùng dòng CPython với Pyodide trong trình duyệt để chấm cho khớp.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Cài dependency
        run: npm ci

      # lint + typecheck + unit test + content:check (xem docs/workflow.md)
      - name: npm run check
        run: npm run check

      - name: npm run content:verify
        run: npm run content:verify

  # E2E chạy trên **bản build**, không phải dev server: đây là thứ sẽ deploy.
  e2e:
    name: e2e
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cài dependency
        run: npm ci

      - name: Lấy trình duyệt từ cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cài trình duyệt
        run: npx playwright install --with-deps chromium webkit

      - name: Playwright trên bản build
        run: npm run test:e2e
        env:
          PLAYWRIGHT_PREVIEW: '1'

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
