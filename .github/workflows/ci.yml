name: CI

on:
  pull_request:
  push:
    branches: [main]

# Một PR đẩy nhiều commit liên tiếp: chỉ chạy lần cuối.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # content:verify chạy lời giải mẫu bằng CPython thật (xem docs/testing.md).
      # Cùng dòng CPython với Pyodide trong trình duyệt để chấm cho khớp.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Cài dependency
        run: npm ci

      # lint + typecheck + unit test + content:check (xem docs/workflow.md)
      - name: npm run check
        run: npm run check

      - name: npm run content:verify
        run: npm run content:verify

  # E2E chạy trên **bản build**, không phải dev server: đây là thứ sẽ deploy.
  e2e:
    name: e2e
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Ảnh chính thức của Playwright đã có sẵn trình duyệt và thư viện hệ thống:
    # không cần `apt-get` nữa, nên mirror Ubuntu sập không chặn CI (S0-25).
    # Phiên bản phải khớp @playwright/test trong package-lock.json (bước dưới kiểm).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # Chromium dùng nhiều bộ nhớ chia sẻ; thiếu cờ này dễ chết giữa chừng (tài liệu Playwright).
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cài dependency
        run: npm ci

      - name: Kiểm phiên bản Playwright khớp ảnh container
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          if [ "$installed" != "1.64.1" ]; then
            echo "::error::@playwright/test là $installed nhưng ảnh container là v1.64.1 — sửa image trong ci.yml"
            exit 1
          fi

      - name: Playwright trên bản build
        run: npm run test:e2e
        env:
          PLAYWRIGHT_PREVIEW: '1'

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
