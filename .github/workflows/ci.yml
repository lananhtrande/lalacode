name: CI

on:
  pull_request:
  push:
    branches: [main]

# Một PR đẩy nhiều commit liên tiếp: chỉ chạy lần cuối.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # content:verify chạy lời giải mẫu bằng CPython thật (xem docs/testing.md).
      # Cùng dòng CPython với Pyodide trong trình duyệt để chấm cho khớp.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Cài dependency
        run: npm ci

      # lint + typecheck + unit test + content:check (xem docs/workflow.md)
      - name: npm run check
        run: npm run check

      - name: npm run content:verify
        run: npm run content:verify

  # E2E chạy trên **bản build**, không phải dev server: đây là thứ sẽ deploy.
  e2e:
    name: e2e
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cài dependency
        run: npm ci

      - name: Lấy trình duyệt từ cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Bình thường mất ~30 giây, nhưng thỉnh thoảng treo (có lần tới khi job bị
      # huỷ sau 30 phút). Mỗi lần thử tối đa 5 phút, thử lại một lần rồi mới đỏ.
      - name: Cài trình duyệt
        timeout-minutes: 12
        run: |
          for attempt in 1 2; do
            timeout 5m npx playwright install --with-deps chromium webkit && exit 0
            echo "::warning::Cài trình duyệt lần $attempt quá 5 phút hoặc lỗi, thử lại"
            # `timeout` chỉ giết `npx`; `apt-get` nó gọi vẫn chạy và giữ khoá, nên
            # lần thử sau hỏng ngay ("Could not get lock"). Dừng nó rồi đợi khoá nhả.
            sudo pkill -TERM -x apt-get || true
            for _ in $(seq 1 30); do
              sudo fuser /var/lib/apt/lists/lock /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
              sleep 2
            done
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Playwright trên bản build
        run: npm run test:e2e
        env:
          PLAYWRIGHT_PREVIEW: '1'

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
