name: CI

on:
  pull_request:
  push:
    branches: [main]

# Một PR đẩy nhiều commit liên tiếp: chỉ chạy lần cuối.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cài dependency
        run: npm ci

      # lint + typecheck + unit test + content:check (xem docs/workflow.md)
      - name: npm run check
        run: npm run check
