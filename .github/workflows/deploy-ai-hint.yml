name: Deploy ai-hint

on:
  push:
    branches: [main]
    paths:
      - 'services/ai-hint/**'
      - '.github/workflows/deploy-ai-hint.yml'
  workflow_dispatch:

concurrency:
  group: deploy-ai-hint
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cài dependency
        run: npm ci

      - name: Kiểm tra trước khi deploy
        run: npm run check

      # Gói cả AWS SDK vào thay vì dùng bản có sẵn trong runtime: như vậy
      # phiên bản SDK do mình quyết, AWS cập nhật runtime cũng không đổi hành vi.
      - name: Đóng gói Lambda
        run: |
          npm run bundle -w @lalacode/ai-hint
          cd services/ai-hint/dist && zip -q -r ../ai-hint.zip index.mjs

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Cập nhật code Lambda
        run: |
          aws lambda update-function-code \
            --function-name lalacode-ai-hint \
            --zip-file fileb://services/ai-hint/ai-hint.zip \
            --publish --no-cli-pager > /dev/null
          aws lambda wait function-updated-v2 --function-name lalacode-ai-hint
